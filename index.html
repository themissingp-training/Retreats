<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascending Together | Team Building Retreats by The Missing P</title>
<meta name="description" content="Ascending Together: one-day team building retreats by The Missing P, led by Usman Gulzari. Trusted by IRC, UN Women, The World Bank and 15+ organizations.">
<meta property="og:title" content="Ascending Together | Team Building Retreats">
<meta property="og:description" content="One day out. Back as one team. Retreats by The Missing P, trusted by IRC, UN Women, The World Bank and 15+ organizations.">
<meta property="og:image" content="assets/img/irc-circle-lawn.jpg">
<link rel="icon" href="assets/logos/tmp-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* DESIGN 1 · TEAM SPIRIT
   Layout: white page, TMP black + blue as the backbone. The three retreat teams
   (Toofan blue, Bijli yellow, Aag coral) colour everything playful: stickers, stats, stops. */
:root{
  --ink:#0B0D12;        /* TMP logo black */
  --blue:#1F80E6;       /* TMP logo blue  = Toofan */
  --yellow:#FFC22E;     /* Bijli */
  --coral:#FF6447;      /* Aag */
  --bg:#FFFFFF;
  --tint:#EEF5FD;       /* pale blue wash */
  --line:#E2E8F0;
  --muted:#5B6474;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:76px;scroll-margin-top:64px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.02;letter-spacing:-.02em}
h2{font-size:clamp(2.1rem,5.4vw,3.4rem);font-weight:800}
h3{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
p,figure,blockquote,ol,ul{margin:0}
img{display:block;max-width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.eyebrow::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:14px 0 0 var(--yellow);margin-right:16px}
.lede{color:var(--muted);font-size:1.06rem;max-width:60ch}
.head{display:grid;gap:14px;margin-bottom:40px;max-width:760px}
.btn{display:inline-flex;align-items:center;gap:10px;font:700 1rem/1 var(--f-body);padding:16px 24px;border-radius:999px;border:2px solid var(--ink);background:var(--blue);color:#fff;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn .arr{transition:transform .2s}.btn:hover .arr{transform:translateX(3px)}
.btn.ghost{background:#fff;color:var(--ink)}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:10px;gap:12px}
.top img{height:34px;width:auto}
.top .btn{padding:10px 16px;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}

/* HERO */
.hero{padding-block:44px 30px;overflow:hidden}
#hero{display:grid;gap:36px;align-items:center}
@media(min-width:900px){#hero{grid-template-columns:1.05fr .95fr;gap:48px}}
.hero h1{font-size:clamp(2.9rem,8.6vw,5.6rem);font-weight:800;margin-top:16px}
.h1a{display:block}
.h1b{display:block;color:var(--blue)}
.h1b::after{content:"";display:block;width:min(340px,70%);height:12px;margin-top:6px;border-radius:12px;background:linear-gradient(90deg,var(--blue) 0 33%,var(--yellow) 33% 66%,var(--coral) 66%)}
.sub{font-size:1.12rem;color:var(--muted);max-width:52ch;margin-top:22px}
.ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.hero-media{position:relative;max-width:560px;width:100%;justify-self:center}
.hero-photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:44% 56% 52% 48%/48% 44% 56% 52%;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--yellow)}
.hero-collage{display:none}
.hero-media::before,.hero-media::after{position:absolute;z-index:2;font:800 1rem var(--f-display);padding:8px 14px;border-radius:12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.hero-media::before{content:"Toofan · Bijli · Aag";top:6%;left:-2%;background:#fff;transform:rotate(-6deg)}
.hero-media::after{content:"500+ climbers";bottom:8%;right:0;background:var(--coral);color:#fff;transform:rotate(5deg)}
#proof{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:40px}
@media(min-width:760px){#proof{grid-template-columns:repeat(4,1fr)}}
.stat{border:2px solid var(--ink);border-radius:18px;padding:16px;display:grid;gap:4px;background:#fff}
.stat:nth-child(1){background:var(--blue);color:#fff}
.stat:nth-child(2){background:var(--yellow)}
.stat:nth-child(3){background:var(--coral);color:#fff}
.stat strong{font:800 clamp(1.8rem,5vw,2.4rem)/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.86rem;line-height:1.35}

/* LOGOS */
#logos{padding-block:30px;border-block:1px solid var(--line)}
.label{font-weight:700;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.marquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;width:max-content;animation:slide 55s linear infinite}
.track,.dup{gap:44px;align-items:center}
.dup{display:flex;padding-left:44px}
.marquee:hover .track{animation-play-state:paused}
.track img{height:48px;width:auto;max-width:180px;object-fit:contain;filter:grayscale(1) contrast(1.1);opacity:.85;transition:filter .25s,opacity .25s,transform .25s}
.track img.tall{height:72px;filter:grayscale(1) brightness(.55) contrast(1.3)}
.track img:hover{filter:none;opacity:1;transform:scale(1.08)}
@keyframes slide{to{transform:translateX(-50%)}}
.m2{margin-top:18px}
.track.rev{animation-direction:reverse;animation-duration:34s}
.wm{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:12px;white-space:nowrap;font:800 1.02rem/1 var(--f-display);letter-spacing:-.01em;border:2px solid var(--ink);background:#fff}
.wm.w0{color:var(--blue)}.wm.w1{color:#B57B00;background:#FFF6DC}.wm.w2{color:#E0472B}
.more{font-size:.86rem;color:var(--muted);margin-top:14px}

/* VIDEOS */
.videos{background:var(--tint)}
#videos{display:grid;gap:40px;align-items:center}
@media(min-width:900px){#videos{grid-template-columns:.9fr 1.1fr}}
.v-copy{display:grid;gap:16px}
.loop{padding:0;display:grid;gap:10px;margin-top:6px}
.loop li{list-style:none;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 14px}
.loop b{font:800 1.1rem var(--f-display);text-align:center;border-radius:8px;padding:4px 0}
.loop li:nth-child(1) b{background:var(--blue);color:#fff}.loop li:nth-child(2) b{background:var(--yellow)}.loop li:nth-child(3) b{background:var(--coral);color:#fff}
.cta-row{margin-top:8px}
.v-media{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:end}
.vid{display:grid;gap:8px;min-width:0}
.vid video{width:100%;border-radius:18px;border:3px solid var(--ink);background:var(--ink);display:block}
.vid.wide video{aspect-ratio:16/9;object-fit:cover}
.vid.tall video{aspect-ratio:9/16;object-fit:cover;box-shadow:6px 6px 0 var(--coral)}
.vid.wide video{box-shadow:6px 6px 0 var(--yellow)}
.vid figcaption{font-weight:700;font-size:.88rem}
@media(max-width:560px){.v-media{grid-template-columns:1fr}.vid.tall{max-width:300px;justify-self:center;width:100%}}
.v-media:not(:has(.tall)){grid-template-columns:1fr;gap:22px}
.v-media:not(:has(.tall)) .vid:nth-child(2) video{box-shadow:6px 6px 0 var(--coral)}

/* WHY */
.why-grid{display:grid;gap:16px}
@media(min-width:700px){.why-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.why-grid{grid-template-columns:repeat(3,1fr)}}
.why-item{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:22px;border:2px solid var(--line);border-radius:20px;transition:border-color .2s,transform .2s}
.why-item:hover{border-color:var(--ink);transform:translateY(-3px)}
.mk{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 1.2rem var(--f-display);border:2px solid var(--ink)}
.c0 .mk{background:var(--blue);color:#fff}.c1 .mk{background:var(--yellow)}.c2 .mk{background:var(--coral);color:#fff}
.why-item h3{margin-bottom:6px}
.why-item p{color:var(--muted);font-size:.95rem}

/* PORTFOLIO */
.portfolio{background:var(--ink);color:#fff}
.portfolio .lede{color:#B8C0CE}
.portfolio .eyebrow{color:var(--yellow)}
.port{display:grid;gap:18px}
@media(min-width:640px){.port{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.port{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;color:var(--ink);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.shots-strip{position:relative;display:grid;gap:3px;aspect-ratio:4/3;background:var(--ink)}
.shots-strip img{width:100%;height:100%;object-fit:cover;min-height:0}
.shots-strip.n2{grid-template-columns:1fr 1fr}
.shots-strip.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.shots-strip.n3 img:first-child{grid-row:span 2}
.shots-strip.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.badge{position:absolute;left:12px;bottom:12px;font:800 1.9rem/1 var(--f-display);padding:8px 12px;border-radius:12px;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);transform:rotate(-4deg)}
.badge small{display:block;font:700 .68rem var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.card .body{padding:18px 20px 22px;display:grid;gap:10px;align-content:start}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--blue)}
.card p{color:var(--muted);font-size:.94rem}
.more-head{display:grid;gap:4px;margin-top:40px}
.more-port{display:grid;gap:12px;margin-top:16px}
@media(min-width:760px){.more-port{grid-template-columns:repeat(2,1fr)}}
.mini{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:18px;border:2px solid rgba(255,255,255,.18)}
.mini-n{display:grid;justify-items:center;min-width:92px;flex:none}
.mini-n small{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#B8C0CE;margin-top:6px}
.mini b{font-size:1.05rem}
.mini strong{font:800 2.2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.mini.c0 strong{color:#6FB2FF}.mini.c1 strong{color:var(--yellow)}.mini.c2 strong{color:#FF8D76}
.mini b{display:block;line-height:1.25}.mini span{font-size:.82rem;color:#B8C0CE}
.mini:nth-child(4) strong{color:#6FB2FF}

/* RESULTS */
.quotes{display:grid;gap:16px}
@media(min-width:760px){.quotes{grid-template-columns:repeat(2,1fr)}}
.q{border:2px solid var(--ink);border-radius:22px;padding:24px;display:grid;gap:18px;align-content:space-between;background:#fff}
.q blockquote{font-size:1.06rem;line-height:1.55}
.q blockquote::before{content:"“";display:block;font:800 3.6rem/.6 var(--f-display);margin-bottom:8px}
.q.c0 blockquote::before{color:var(--blue)}.q.c1 blockquote::before{color:var(--yellow)}.q.c2 blockquote::before{color:var(--coral)}
.q.feature{background:var(--blue);color:#fff;border-color:var(--blue)}
.q.feature blockquote{font-size:1.25rem}
.q.feature blockquote::before{color:var(--yellow)}
.who{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.who b{display:block;line-height:1.2}.who small{color:var(--muted);font-size:.85rem}
.q.feature .who small{color:#D6E8FF}
.proofwall{display:grid;gap:16px;margin-top:20px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.proofwall{grid-template-columns:repeat(3,1fr)}}
.ss{display:grid;gap:8px;align-content:start;min-width:0}
.vtwall{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;align-items:flex-end}
.vt.tall{width:100%;max-width:300px}
.vt.wide{flex:1 1 420px}
.vt{display:grid;gap:8px;min-width:0}
.vt video{width:100%;border-radius:18px;border:3px solid var(--ink);background:var(--ink);object-fit:cover;display:block}
.vt.tall video{aspect-ratio:9/16;box-shadow:6px 6px 0 var(--blue)}
.vt.wide video{aspect-ratio:16/9;box-shadow:6px 6px 0 var(--yellow)}
.vt figcaption{font-weight:700;font-size:.88rem}
.films{margin-top:30px;display:grid;gap:12px}
.films-grid{display:grid;gap:18px}
@media(min-width:760px){.films-grid{grid-template-columns:1fr 1fr}}
.film{display:grid;gap:8px;min-width:0}
.film video{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;border:3px solid #fff;background:#000;display:block}
.film:nth-child(1) video{box-shadow:6px 6px 0 var(--blue)}.film:nth-child(2) video{box-shadow:6px 6px 0 var(--coral)}
.film figcaption{font-weight:700;font-size:.92rem}
.films{margin-top:44px;padding:26px;border-radius:26px;background:linear-gradient(135deg,rgba(31,128,230,.22),rgba(255,100,71,.16));border:2px solid rgba(255,255,255,.14)}
.films-head{display:grid;gap:4px}
.films-text{color:#C9D2E0;font-size:.95rem}
.films .rv-title{font-size:1.6rem}
.film.tall video{aspect-ratio:9/16}
.films-grid:has(.tall){grid-template-columns:1fr;align-items:center}
@media(min-width:700px){.films-grid:has(.tall){grid-template-columns:1.7fr 1fr}}
.film.tall{max-width:330px;width:100%;justify-self:center}
.film figcaption{display:flex;align-items:center;gap:8px}
.film figcaption::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.film:nth-child(2) figcaption::before{background:var(--coral)}
.zoom{all:unset;cursor:zoom-in;display:block;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;height:220px;transition:border-color .2s}
.zoom:hover{border-color:var(--ink)}
.zoom:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.zoom img{width:100%;height:100%;object-fit:cover;object-position:top}
.ss figcaption{font-size:.82rem;font-weight:600;color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(11,13,18,.85);display:grid;place-items:center;padding:24px}
.lightbox img{max-height:88vh;max-width:min(960px,100%);border-radius:12px;background:#fff}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;font-size:1.6rem;cursor:pointer;background:#fff;color:var(--ink)}

/* THE DAY */
.day{background:var(--tint)}
.beh{display:grid;gap:12px;margin-bottom:28px}
.beh-intro{font-weight:700}
.beh-row{display:grid;gap:12px}
@media(min-width:700px){.beh-row{grid-template-columns:repeat(3,1fr)}}
.beh-item{border:2px solid var(--ink);border-radius:18px;padding:16px 18px;display:grid;gap:4px;background:#fff}
.beh-item b{font:800 1.5rem/1 var(--f-display)}
.beh-item.c0 b{color:var(--blue)}.beh-item.c1 b{color:#C98A00}.beh-item.c2 b{color:var(--coral)}
.beh-item span{color:var(--muted);font-size:.95rem}
.beh-anchor{font-size:.92rem;color:var(--muted);max-width:70ch}
.route{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;position:relative}
@media(min-width:640px){.route{grid-template-columns:repeat(3,1fr)}}.stop{position:relative;z-index:1;font:inherit;text-align:left;cursor:pointer;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;display:grid;gap:2px;transition:transform .15s,box-shadow .15s}
.stop:hover{transform:translateY(-3px)}
.stop .t{font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.stop .n{font:800 1rem/1.15 var(--f-display)}
.stop[aria-selected="true"]{box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px)}
.stop.c0[aria-selected="true"]{background:var(--blue);color:#fff}
.stop.c1[aria-selected="true"]{background:var(--yellow)}
.stop.c2[aria-selected="true"]{background:var(--coral);color:#fff}
.stop[aria-selected="true"] .t{color:inherit}
.panel{margin-top:18px;background:#fff;border:2px solid var(--ink);border-radius:24px;overflow:hidden;display:grid}
@media(min-width:820px){.panel{grid-template-columns:1fr 1.1fr}}
.p-photo{min-height:240px;background:var(--ink)}
.p-photo img{width:100%;height:100%;object-fit:cover;max-height:420px}
.p-copy{padding:26px;display:grid;gap:12px;align-content:start}
.p-stage{font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.p-meta{font-weight:700;font-size:.85rem;display:inline-block;justify-self:start;padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff;font-variant-numeric:tabular-nums}
.rv{margin-top:30px;display:grid;gap:12px}
.rv-title{font:800 1.3rem var(--f-display)}
.rv-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.rv-chip{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#fff;color:var(--ink);text-decoration:none;border:2px solid #fff;transition:transform .15s}
.rv-chip:hover{transform:translateY(-3px)}
.rv-chip b{display:block;line-height:1.2}.rv-chip small{color:var(--muted);font-size:.8rem}
.rv-play{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--coral)}
.rv-chip.c0 .rv-play{background:var(--blue)}.rv-chip.c1 .rv-play{background:var(--yellow)}
.rv-play::after{content:"";border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.rv-chip.c1 .rv-play::after{border-left-color:var(--ink)}
.p-copy h3{font-size:clamp(1.8rem,4vw,2.4rem)}
.p-copy>p{color:var(--muted)}
.debrief{border-radius:16px;padding:14px 16px;background:var(--tint)}
.panel.c1 .debrief{background:#FFF4D6}.panel.c2 .debrief{background:#FFE6E0}
.debrief b{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
.teams{display:flex;gap:8px;flex-wrap:wrap}
.teams span{font:800 1rem var(--f-display);padding:5px 12px;border-radius:10px;border:2px solid var(--ink)}
.tm0{background:var(--blue);color:#fff}.tm1{background:var(--yellow)}.tm2{background:var(--coral);color:#fff}
.p-nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.pn{font:700 .92rem var(--f-body);background:none;border:2px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;color:var(--ink)}
.pn:hover:not(:disabled){border-color:var(--ink)}
.pn:disabled{opacity:.35;cursor:default}
.anim{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.note{margin-top:18px;color:var(--muted);font-size:.92rem}

/* TRAINER */
#trainer{display:grid;gap:30px;align-items:center}
@media(min-width:820px){#trainer{grid-template-columns:.8fr 1.2fr;gap:56px}}
.t-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--blue)}
.t-photo{max-width:420px}
#trainer h2{margin-top:12px}
.t-role{font-weight:700;color:var(--blue);margin:6px 0 14px}
.tstats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
@media(min-width:600px){.tstats{grid-template-columns:repeat(4,1fr)}}
.tstats div{border-top:4px solid var(--ink);padding-top:10px}
.tstats div:nth-child(1){border-color:var(--blue)}.tstats div:nth-child(2){border-color:var(--yellow)}.tstats div:nth-child(3){border-color:var(--coral)}
.tstats strong{display:block;font:800 1.9rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tstats span{font-size:.84rem;color:var(--muted)}

/* FORM */
.plan{background:var(--blue);color:#fff;position:relative;overflow:hidden}
.plan::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--yellow);opacity:.18;top:-140px;left:-120px}
.plan-grid{display:grid;gap:34px;position:relative}
@media(min-width:960px){.plan-grid{grid-template-columns:.8fr 1.2fr;gap:56px}}
.plan .eyebrow{color:var(--yellow)}
.plan .eyebrow::before{background:var(--yellow);box-shadow:14px 0 0 #fff}
#plan-copy{display:grid;gap:16px;align-content:start}
#plan-copy .lede{color:#DCEBFF}
.promises{padding:0;display:grid;gap:10px}
.promises li{list-style:none;display:flex;gap:10px;align-items:flex-start}
.promises li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--ink);font-weight:800;font-size:.8rem;margin-top:1px}
.contact{font-size:.9rem;color:#DCEBFF}
#leadbox{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:26px;padding:22px;box-shadow:8px 8px 0 var(--ink);min-width:0}
@media(min-width:600px){#leadbox{padding:32px}}
.progress{display:flex;gap:6px;margin-bottom:18px}
.progress i{flex:1;height:8px;border-radius:8px;background:var(--line);transition:background .3s}
.progress i.on:nth-child(1){background:var(--blue)}.progress i.on:nth-child(2){background:var(--yellow)}.progress i.on:nth-child(3){background:var(--coral)}
.steplabel{font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}
legend{font-weight:700;margin-bottom:10px;padding:0}
legend small{font-weight:500;color:var(--muted);margin-left:4px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills label{position:relative}
.pills input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pills span{display:inline-block;padding:10px 15px;border-radius:999px;border:2px solid var(--line);font-size:.93rem;font-weight:500;cursor:pointer;transition:.15s;background:#fff}
.pills label:hover span{border-color:var(--ink)}
.pills input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.pills input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
.fields{display:grid;gap:14px}
@media(min-width:600px){.fields{grid-template-columns:1fr 1fr}}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:700;font-size:.92rem}
.field input{font:inherit;padding:13px 14px;border-radius:12px;border:2px solid var(--line);width:100%;background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--blue)}
.full{grid-column:1/-1}
.err{color:#D93A1E;font-weight:700;font-size:.9rem;min-height:1.3em}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.back{background:none;border:0;font:700 .95rem var(--f-body);color:var(--muted);cursor:pointer;padding:8px}
.fine{font-size:.82rem;color:var(--muted);margin-top:14px}
.thanks{display:grid;gap:14px}
.thanks h3{font-size:2.2rem}
.cal{border:2px dashed var(--line);border-radius:18px;min-height:300px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.cal{display:block}
.cal iframe{width:100%;min-height:680px;border:0;display:block}
.cal-alt{margin-top:10px;font-size:.9rem;text-align:center}
.cal-alt a{color:var(--blue);font-weight:700}
.jot iframe{width:100%;min-height:1100px;border:0}

footer{padding-block:40px 120px;border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}
footer img{height:40px;width:auto}
footer p{color:var(--muted);font-size:.9rem}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#fff;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px;transform:translateY(110%);transition:transform .3s}
.sticky.show{transform:none}
.sticky p{font-size:.86rem;line-height:1.25}.sticky b{display:block;font-family:var(--f-display);font-size:1.05rem}
.sticky .btn{padding:11px 16px;font-size:.92rem;flex:none;box-shadow:3px 3px 0 var(--ink)}
@media(min-width:900px){.sticky{display:none}}
</style>
</head>
